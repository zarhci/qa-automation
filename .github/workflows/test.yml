name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (API + UI)
    runs-on: ubuntu-24.04
    env:
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m smoke --html=report-smoke.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-smoke
          path: report-smoke.html

  api:
    name: Full (API)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/api --html=report-api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-api
          path: report-api.html

  ui-regression:
    name: Regression (UI)
    runs-on: ubuntu-24.04
    env:
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ui -m regression --html=report-ui-regression.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-ui-regression
          path: report-ui-regression.html

  publish:
    name: Publish report
    needs: [smoke, api, ui-regression]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: site
      - name: Create index page
        run: |
          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>QA automation: отчёты</title></head>
          <body style="font-family: sans-serif; max-width: 600px; margin: 40px auto;">
            <h1>QA automation: отчёты</h1>
            <ul>
              <li><a href="report-smoke.html">Smoke (API + UI)</a></li>
              <li><a href="report-api.html">Полный прогон API (Restful Booker)</a></li>
              <li><a href="report-ui-regression.html">Regression UI (SauceDemo)</a></li>
            </ul>
          </body>
          </html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment